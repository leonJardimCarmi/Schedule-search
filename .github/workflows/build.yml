# Builds the project and runs the tests on Windows, Linux and macOS on every
# push and pull request (DECISIONS D46). Results: the "Actions" tab on GitHub,
# and a check mark or a cross next to each commit.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false          # one failing system does not cancel the others
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Release, like the measurements in PLAN. The same CMakeLists.txt as in
      # Visual Studio; FetchContent downloads nlohmann/json and Catch2.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # --config is needed on Windows, where one build folder holds several
      # configurations; elsewhere it is ignored.
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      # The console output of 23 fixed runs, compared line by line with
      # tests/golden/expected/ (D63). A difference between the systems is
      # a finding, not noise.
      - name: Golden output
        shell: bash
        run: |
          exe=build/schedule_search
          if [ -f build/Release/schedule_search.exe ]; then exe=build/Release/schedule_search.exe; fi
          bash tools/golden.sh "$exe"

      # The JSON results of the golden runs, against the contract (D62): the
      # JSON Schema, and the ids that point into the problem. The shape does
      # not depend on the system, so Linux is enough; the golden above
      # already compares the content on all three.
      - name: Contract (JSON Schema)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --quiet "jsonschema>=4.18"
          python3 tools/check_contract.py tests/golden/actual/*_json.out contract/examples/*.result.json
          # The inputs (D66): every problem file the engine runs on, and the
          # hand-made schedules; a broken problem file must fail.
          python3 tools/check_contract.py --schema problem data/example_week.json data/month_15x90.json \
            data/cafe_december.json data/medics_december.json tests/golden/inputs/holes.json tests/golden/inputs/impossible.json
          python3 tools/check_contract.py --schema schedule tests/golden/inputs/broken.json tests/golden/actual/saved_week.json
          ! python3 tools/check_contract.py --schema problem data/bad_example.json > /dev/null

      # The program itself, end to end, on the example week. Windows puts the
      # program in build/Release/, the others in build/.
      - name: Run the example week
        shell: bash
        run: |
          exe=build/schedule_search
          if [ -f build/Release/schedule_search.exe ]; then exe=build/Release/schedule_search.exe; fi
          "$exe" data/example_week.json --time-limit 10
